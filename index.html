<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Aprende prompting con encargos, pistas y retroalimentación. Un juego en español que funciona sin internet.">
<title>Prompt Quest | Tu primera misión</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/historia.css">
<link rel="stylesheet" href="styles/misiones.css">
<link rel="stylesheet" href="styles/escritorio.css">
</head>
<body>
<section id="cover-screen" class="story-screen" aria-labelledby="cover-title">
  <div class="cover-content"><p class="agency-label" data-copy="agencyLabel"></p><h1 id="cover-title" tabindex="-1">PROMPT<br>QUEST</h1><p data-copy="coverPitch"></p></div>
  <div class="story-footer"><button id="start-day" class="primary story-action" type="button" data-copy="startDay"></button></div>
</section>
<section id="welcome-screen" class="story-screen" aria-labelledby="welcome-title" hidden>
  <div><p id="welcome-progress"></p><progress id="welcome-bar" max="3" value="1" aria-label="Progreso de bienvenida"></progress></div>
  <h2 id="welcome-title" tabindex="-1" data-copy="welcomeTitle"></h2>
  <img id="guide-image" class="guide-image" src="assets/epson_ia_mano_abajo.png" width="480" height="268" alt="Epson_IA, el mapache que te da la bienvenida" decoding="async">
  <div class="chat-message guide-message"><p class="speaker">Epson_IA</p><p id="welcome-message" aria-live="polite" aria-atomic="true"></p></div>
  <div class="story-footer welcome-actions"><button type="button" id="welcome-back" data-copy="back"></button><button type="button" id="welcome-next" class="primary"></button></div>
</section>
<section id="portfolio-screen" class="story-screen portfolio-screen" aria-labelledby="portfolio-title" hidden>
  <p class="agency-label" data-copy="agencyLabel"></p>
  <h2 id="portfolio-title" tabindex="-1"></h2>
  <div id="graduation-message" class="chat-message guide-message" hidden><p class="speaker">Epson_IA</p><p data-copy="graduationMessage"></p></div>
  <p id="portfolio-note" class="small muted" data-copy="portfolioNote"></p>
  <p id="portfolio-empty" data-copy="portfolioEmpty"></p>
  <div id="portfolio-items"></div>
  <div class="story-footer"><button type="button" id="return-game" class="primary story-action" data-copy="returnGame"></button></div>
</section>
<a class="skip" href="#work-area" data-copy="skip"></a>
<header>
  <div class="shell header-row">
    <h1 data-copy="missionTitle"></h1><nav class="laptop-only desktop-task-links" aria-label="Ventanas abiertas"><button type="button" id="task-mail" aria-pressed="false" hidden data-copy="inbox"></button><button type="button" id="task-terminal" aria-pressed="false" hidden data-copy="taskTerminal"></button></nav>
    <button id="open-portfolio" type="button" class="portfolio-link" data-copy="portfolioTitle"></button>
    <div class="progress-box"><div class="progress-label"><span data-copy="level"></span><span id="progress-text"></span></div><progress id="progress" value="0" max="3" aria-label="Reputación de la agencia: misiones completadas"></progress></div>
  </div>
</header>
<main id="work-area" class="shell mission-desktop" tabindex="-1">
  <section id="mobile-notification" class="computer-window mobile-only notification-space" aria-label="Notificaciones de correo">
    <button type="button" id="mail-notification" class="mail-notification"><span class="notification-label" data-copy="notificationLabel"></span><strong id="notification-sender"></strong><span id="notification-subject"></span><span class="notification-help" data-copy="tapNotification"></span></button>
  </section>
  <section id="client-profile" class="computer-window mobile-only" aria-labelledby="profile-heading">
    <div class="window-bar"><button type="button" id="back-profile" aria-label="Volver a la bandeja de correo">←</button><h2 id="profile-heading"></h2><span class="tag" data-copy="clientLabel"></span></div>
    <div class="profile-content"><button type="button" id="read-client" class="client-profile-tap"><span id="client-initials" class="client-initials" aria-hidden="true"></span><strong id="profile-name"></strong><span data-copy="clientWrote"></span></button></div>
    <p class="profile-instruction" data-copy="tapProfile"></p>
  </section>
  <section id="inbox-window" class="computer-window" aria-labelledby="inbox-title">
    <div class="window-bar mail-bar"><h2 id="inbox-title" data-copy="inbox"></h2><span class="tag" data-copy="unread"></span><button type="button" id="close-mail" class="laptop-only window-close" aria-label="Cerrar Correo">×</button></div>
    <div class="mail-list">
      <button type="button" id="new-mail" class="mail-item"><strong id="mail-sender"></strong><span id="mail-subject"></span><span class="muted" id="mail-preview"></span></button>
      <article class="mail-note"><p class="speaker">Epson_IA</p><p data-copy="mailGuide"></p></article>
    </div>
    <p class="mobile-only mobile-copy inbox-instruction" data-copy="tapMail"></p>
    <div class="window-actions mail-footer"><button type="button" class="primary" id="open-mail" data-copy="openMail"></button></div>
    <section id="chat-window" class="conversation" aria-labelledby="client-name">
      <div class="window-bar"><button type="button" id="back-mail" aria-label="Volver al correo">←<span class="laptop-only" data-copy="inbox"></span></button><h2 id="client-name" tabindex="-1"></h2><span class="tag" data-copy="clientLabel"></span><button type="button" id="close-chat" class="laptop-only window-close" aria-label="Cerrar Correo">×</button></div>
      <div id="chat-scroll" class="window-scroll" tabindex="0" role="log" aria-label="Conversación con el cliente" aria-live="polite">
        <div class="chat-message client-message"><p class="speaker" id="client-speaker"></p><p id="brief"></p></div>
        <div id="client-guide" class="chat-message guide-message"><p class="speaker">Epson_IA</p><p class="laptop-copy" data-copy="chatGuide"></p><p class="mobile-only mobile-copy" data-copy="mobileChatGuide"></p></div>
        <div id="chat-hints"></div>
        <div class="required-line"><p data-copy="requiredIntro"></p><ul class="chips" id="required-chips" role="list"></ul></div>
      </div>
      <div class="window-actions"><button type="button" class="hint-button" id="hint-button" aria-controls="chat-hints"></button><button type="button" id="start-prompt" class="primary" data-copy="startPrompt"></button></div>
    </section>
  </section>
  <section id="terminal-window" class="computer-window terminal-window" aria-labelledby="editor-title">
    <div class="window-bar"><button type="button" id="back-chat" aria-label="Volver a la conversación">←</button><h2 id="editor-title" data-copy="terminalTitle"></h2><span id="terminal-mission" class="tag"></span><button type="button" id="close-terminal" class="laptop-only window-close" aria-label="Cerrar terminal">×</button></div>
    <div id="terminal-scroll" class="window-scroll terminal-scroll" tabindex="0" role="region" aria-label="Terminal de trabajo">
      <p id="terminal-to" class="terminal-context"></p><p id="terminal-brief" class="terminal-context"></p>
      <details id="terminal-history" class="terminal-history" hidden><summary data-copy="historyTitle"></summary><div id="history-items"></div></details>
      <form id="prompt-form" novalidate>
        <label for="prompt" data-copy="promptLabel"></label>
        <div class="terminal-input"><span class="prompt-prefix" aria-hidden="true">&gt; <span class="terminal-cursor"></span></span><textarea id="prompt" name="prompt" rows="6" maxlength="1500" aria-required="true" aria-describedby="privacy-note editor-help input-error" spellcheck="true"></textarea></div>
        <p id="input-error" class="error small" role="alert" hidden></p>
        <div class="editor-bottom"><span id="criteria-count" class="muted"></span><span id="character-count" class="muted"></span></div>
        <p id="evaluating-line" class="terminal-context" role="status" hidden data-copy="evaluatingLine"></p>
        <p id="privacy-note" class="privacy-note" data-copy="privacyShort"></p>
      </form>
      <section id="results-panel" aria-label="Resultados de la evaluación" hidden>
        <pre id="submitted-prompt" class="submitted-prompt"></pre>
        <p class="terminal-context" data-copy="resultsLine"></p><p id="sheet-score" class="terminal-score" role="status"></p>
        <ul id="criteria" class="criteria" role="list"></ul>
        <div id="guide-feedback" class="chat-message guide-message" hidden><p class="speaker">Epson_IA</p><p id="guide-feedback-text"></p></div>
        <p id="result-summary" class="small" role="status"></p>
        <div id="hint" class="hint guide-message" role="status" hidden></div>
        <div id="response" class="response" hidden><h3 id="response-title"></h3><p id="response-note" class="small muted"></p><pre id="response-text"></pre></div>
        <div id="completion" class="completion" hidden><div class="chat-message"><p id="client-reaction-name" class="speaker"></p><p id="client-reaction"></p></div><p class="speaker">Epson_IA</p><p id="completion-text" role="status"></p><p id="next-client-preview" class="small"></p></div>
        <p id="evaluation-mode" class="tag"></p><p id="evaluation-notice" class="notice"></p>
      </section>
      <details class="help"><summary data-copy="helpTitle"></summary><p id="editor-help" class="notice"></p><footer data-copy="footer"></footer></details>
    </div>
    <div class="window-actions terminal-actions">
      <button id="execute" class="primary" type="submit" form="prompt-form" data-copy="execute"></button>
      <div id="result-actions" class="result-actions" hidden><button type="button" id="retry-prompt" data-copy="retryPrompt"></button><button type="button" id="result-hint" class="hint-button" aria-controls="hint"></button><button type="button" id="next-mission" class="primary" hidden data-copy="continue"></button><button type="button" id="view-graduation" class="primary" hidden data-copy="continue"></button></div>
    </div>
  </section>
<div id="desktop-finished" class="laptop-only"><p data-copy="desktopComplete"></p><button type="button" id="desktop-continue" class="primary" data-copy="continue"></button></div>
</main>
<p id="result-announcement" class="sr-only" role="status" aria-atomic="true"></p>
<noscript>Activa JavaScript en tu navegador para jugar. No necesitas conexión a internet.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>

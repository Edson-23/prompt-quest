<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Aprende prompting con encargos, pistas y retroalimentación. Un juego en español que funciona sin internet.">
<title>Prompt Quest | Tu primera misión</title>
<style>

:root {
  color-scheme: dark;
  --bg: #0d1117;
  --border: #30363d;
  --text: #c9d1d9;
  --success: #7ee787;
  --error: #f85149;
  --hint: #e3b341;
  --title: #79c0ff;
  --muted: #9da7b3;
  --control-border: #697583;
  --dock-space: 0px;
}
* { box-sizing: border-box; }
html { scroll-padding-block-end: var(--dock-space); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 1rem/1.45 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  overflow-wrap: break-word;
}
button, textarea, summary { font: inherit; }
button, summary { min-block-size: 45px; min-inline-size: 45px; }
button {
  cursor: pointer;
  border: 1px solid var(--control-border);
  border-radius: 5px;
  background: transparent;
  color: var(--text);
  padding: .5rem .75rem;
}
button:hover { border-color: var(--title); background: #161e29; }
button:disabled { cursor: default; opacity: .65; }
:focus-visible { outline: 2px solid var(--title); outline-offset: 3px; }
a { color: var(--title); }
.skip { position: fixed; left: .75rem; top: -5rem; background: var(--bg); padding: .6rem; z-index: 3; }
.skip:focus { top: .5rem; }
.shell { width: min(1180px, calc(100% - 1.25rem)); margin-inline: auto; }
header { flex: none; border-bottom: 1px solid var(--border); padding: .5rem 0; padding-top: max(.5rem, env(safe-area-inset-top, 0px)); }
.header-row, .panel-bar, .brief-heading, .editor-bottom, .progress-label { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.header-row > *, .panel-bar > *, .brief-heading > *, .editor-bottom > * { min-inline-size: 0; }
.brand { margin: 0; font-size: 1rem; color: var(--success); white-space: nowrap; }
.brand span { color: var(--text); }
.subtitle, .muted { color: var(--muted); }
.subtitle { display: none; }
.progress-box { width: 9.25rem; flex: none; font-size: .75rem; }
.progress-label { flex-wrap: wrap; gap: 0 .5rem; }
progress { display: block; width: 100%; height: 5px; margin-top: .25rem; accent-color: var(--success); border: 0; background: var(--border); }
progress::-webkit-progress-bar { background: var(--border); border-radius: 4px; }
progress::-webkit-progress-value { background: var(--success); border-radius: 4px; }
progress::-moz-progress-bar { background: var(--success); }
main { flex: 1; min-block-size: 0; display: flex; flex-direction: column; gap: .75rem; padding-block: .75rem calc(4rem + env(safe-area-inset-bottom, 0px)); }
.intro { flex: none; width: 100%; max-inline-size: 36rem; margin-inline: auto; }
h1 { margin: 0; color: #f0f6fc; font-size: 1rem; line-height: 1.35; letter-spacing: -.025em; }
.eyebrow, .intro > .muted { display: none; }
.workspace { flex: 1; min-block-size: 0; display: block; }
.left { width: 100%; max-inline-size: 36rem; margin-inline: auto; display: flex; flex-direction: column; gap: .75rem; }
.panel { min-inline-size: 0; border: 1px solid var(--border); border-radius: 7px; background: #10161e; }
.panel-bar { padding: .375rem .625rem; border-bottom: 1px solid var(--border); background: #161b22; border-radius: 7px 7px 0 0; flex-wrap: wrap; }
h2 { margin: 0; font-size: .875rem; font-weight: 500; color: var(--title); }
.tag { font-size: .75rem; color: var(--muted); }
.mission-panel .tag { display: none; }
.panel-body { padding: .5rem .625rem; }
h3 { margin: 0; font-size: .875rem; color: #f0f6fc; }
p { margin: .5rem 0; }
.brief { margin: .375rem 0; font-size: .875rem; line-height: 1.4; }
.brief p { margin: 0; }
.required-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: .25rem .5rem; }
.required-line > p { font-size: .75rem; margin: 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: .25rem; padding: 0; list-style: none; margin: 0; }
.chips li { padding: .125rem .375rem; font-size: .75rem; border: 1px solid var(--border); border-radius: 4px; }
.hint-button { flex: none; inline-size: 7rem; max-inline-size: 100%; color: var(--hint); border-color: #a58b37; font-size: .875rem; }
.hint { color: var(--hint); background: #211f16; border: 1px solid #a58b37; border-radius: 4px; padding: .625rem; margin-bottom: .75rem; }
.hint p { margin: .375rem 0; }
label { display: block; margin-bottom: .375rem; font-size: .875rem; }
textarea {
  display: block;
  width: 100%;
  height: 8.5rem;
  min-height: 8.5rem;
  max-height: 8.5rem;
  resize: none;
  overflow-y: auto;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--control-border);
  border-radius: 5px;
  padding: .5rem .625rem;
  font-size: max(1rem, 16px);
  line-height: 1.5;
}
textarea::placeholder { color: #9da7b3; }
.editor-bottom {
  position: relative;
  flex-wrap: wrap;
  margin-top: .75rem;
}
.primary { flex: 1; max-inline-size: 14rem; min-block-size: 45px; background: var(--success); border-color: var(--success); color: var(--bg); font-weight: 700; }
.primary:hover { background: #a0efaa; color: var(--bg); border-color: #a0efaa; }
.small { font-size: .875rem; }
#character-count { font-size: .75rem; }
.error { color: var(--error); }
#input-error { margin-block: .375rem 0; }
.privacy-note { margin: .375rem 0 0; font-size: .75rem; color: var(--muted); }
.notice { font-size: .875rem; color: var(--muted); margin: .75rem 0 0; }
.results-panel { flex: 1; min-block-size: 0; display: flex; flex-direction: column; }
.results-panel .panel-bar { flex: none; }
.results-scroll { flex: 1; min-block-size: 0; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-gutter: stable; scroll-padding-block: .75rem; }
.results-scroll:focus-visible { outline-offset: -3px; }
.scroll-hint { color: var(--muted); margin: 0 0 .5rem; font-size: .75rem; }
.result-summary { padding-bottom: .625rem; margin: 0; border-bottom: 1px solid var(--border); }
.criteria { list-style: none; margin: 0; padding: 0; }
.criterion { display: grid; grid-template-columns: 1rem minmax(0, 1fr); gap: .5rem; padding: .625rem 0; border-bottom: 1px solid var(--border); }
.criterion:last-child { border-bottom: 0; }
.criterion p { margin: .25rem 0 0; font-size: .875rem; color: var(--muted); }
.criterion strong { font-weight: 500; }
.requirement { color: var(--muted); font-size: .75rem; margin-left: .5rem; }
.pass .symbol { color: var(--success); }
.fail .symbol { color: var(--error); }
.pending .symbol { color: var(--muted); }
.response { margin-top: .75rem; border-top: 1px solid var(--border); padding-top: .75rem; }
.response h3 { color: var(--title); font-size: 1rem; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: .875rem; margin: .625rem 0 0; }
.completion { padding: .75rem; border: 1px solid #375d3e; border-radius: 5px; background: #13231a; color: var(--success); margin-top: .75rem; }
.completion p { margin: 0; }
.help { border-top: 1px solid var(--border); margin-top: .75rem; }
summary { cursor: pointer; padding-block: .75rem; color: var(--title); font-size: .875rem; }
footer { color: var(--muted); font-size: .875rem; padding-block: .75rem; }
[hidden] { display: none !important; }
/* El escritorio amplía la misma composición; la base está pensada para teléfonos. */
@media (min-width: 768px) {
  :root { --dock-space: 0px; }
  body { height: 100vh; height: 100dvh; }
  .shell { width: min(1180px, calc(100% - 2rem)); }
  header { padding-block: 1rem; }
  .brand { font-size: 1.3rem; }
  .subtitle { display: block; margin: .25rem 0 0; font-size: .875rem; }
  .progress-box { width: 15rem; font-size: .875rem; }
  .progress-label { gap: .5rem; }
  main { gap: 1rem; padding-block: 1.25rem; }
  h1 { font-size: clamp(1.5rem, 1.2rem + 1vw, 2rem); }
  .eyebrow { display: block; color: var(--title); font-size: .875rem; margin: 0 0 .25rem; }
  .intro > .muted { display: block; margin: .375rem 0 0; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
  .intro { max-inline-size: none; }
  .left { max-inline-size: none; gap: 1rem; min-inline-size: 0; }
  .panel-bar { padding: .625rem 1rem; }
  .panel-body { padding: .875rem 1rem; }
  h3 { font-size: .875rem; }
  .mission-panel .tag { display: inline; }
  .brief { margin-block: .75rem; font-size: .875rem; }
  .required-line > p, .chips li { font-size: .875rem; }
  .editor-bottom { position: static; border: 0; background: transparent; margin-top: .75rem; padding: 0; }
  .primary { flex: none; }
  .tag { font-size: .8125rem; }
  .criterion { padding-block: .875rem; }
}
/* Altura reducida, zoom o teclado: priorizar acceso al contenido sobre encajarlo a la fuerza. */
@media (max-height: 38rem) {
  body { height: auto; min-height: 100vh; min-height: 100dvh; }
  main { flex: none; }
  .workspace { flex: none; }
  #desktop-results .results-panel { min-height: 12rem; max-height: 65dvh; }
}
@keyframes arrive { from { opacity: .35; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: no-preference) {
  .completion:not([hidden]), #welcome-message, #graduation-message:not([hidden]) { animation: arrive 220ms ease-out; }
  button { transition: background .15s, border-color .15s; }
}

/* Un único resultado cambia de contenedor al cruzar el punto de quiebre. */
#desktop-results { display: none; }
.results-panel { min-inline-size: 0; }
.sheet-close { margin-left: auto; }
.last-result { margin-top: .75rem; width: 100%; font-size: .875rem; color: var(--title); }
.sheet-is-open .last-result { visibility: hidden; }
.result-sheet {
  position: fixed;
  inset: auto 0 0;
  margin: 0 auto;
  padding: .375rem 0 max(.5rem, env(safe-area-inset-bottom, 0px));
  width: min(100%, 38rem);
  max-width: 100%;
  height: 70vh;
  height: 70dvh;
  max-height: 70dvh;
  border: 1px solid var(--control-border);
  border-bottom: 0;
  border-radius: 14px 14px 0 0;
  background: #10161e;
  color: var(--text);
  box-shadow: 0 -10px 30px #0006;
  z-index: 5;
  overflow: visible;
}
.result-sheet[open], .result-sheet.fallback-open { display: flex; flex-direction: column; }
.result-sheet:popover-open { display: flex; flex-direction: column; }
.result-sheet .results-panel { border: 0; border-radius: 0; }
.result-sheet .panel-bar { padding-block: .25rem; gap: .25rem .5rem; }
.result-sheet .panel-bar { position: relative; padding-right: 3.5rem; min-height: 45px; }
.result-sheet .sheet-close { position: absolute; right: .25rem; top: 0; padding: 0; width: 45px; height: 45px; font-size: 1.25rem; border-color: transparent; }
.result-sheet #evaluation-mode { flex-basis: 100%; }
.sheet-score { display: none; }
.result-sheet .sheet-score { display: block; flex: none; margin: .375rem .625rem; font-size: 1.75rem; font-weight: 700; color: var(--success); }
.result-sheet .sheet-score.is-incomplete { color: var(--error); }
.sheet-edit-note { color: var(--hint); font-size: .875rem; }
.result-sheet .results-scroll { padding-bottom: .875rem; }
.result-sheet .scroll-hint { display: none; }
.result-sheet .result-summary { overflow-wrap: break-word; }
.result-toast {
  position: fixed;
  inset: auto;
  top: var(--toast-top, 70%);
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  padding: .375rem;
  width: min(24rem, calc(100% - 1.5rem));
  max-width: calc(100% - 1.5rem);
  border: 1px solid var(--success);
  border-radius: 7px;
  background: #14251b;
  color: var(--text);
  box-shadow: 0 6px 20px #0005;
  z-index: 4;
}
.result-toast.fallback-open { display: flex; align-items: center; gap: .5rem; }
.result-toast:popover-open { display: flex; align-items: center; gap: .5rem; }
.toast-open { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: .125rem; border: 0; text-align: left; font-size: .875rem; }
.toast-open:hover { background: #1c3225; }
.toast-count { color: var(--success); }
.toast-link { color: var(--title); text-decoration: underline; text-underline-offset: .2em; }
.toast-close { flex: none; padding-inline: .5rem; font-size: .875rem; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; border: 0; }
@supports not selector(:popover-open) {
  [popover]:not(.fallback-open):not([open]) { display: none; }
}
@media (max-width: 767px) {
  /* El editor ocupa el espacio libre sobre la hoja y sigue siendo interactivo. */
  .sheet-is-open > header, .sheet-is-open .intro, .sheet-is-open .mission-panel { display: none; }
  .sheet-is-open .editor-panel {
    position: fixed; inset: 0 0 auto; margin: 0 auto;
    width: min(100%, 38rem); height: 30vh; height: 30dvh;
    display: flex; flex-direction: column; border-radius: 0; z-index: 2;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .sheet-is-open .editor-panel > .panel-bar { flex: none; padding-block: .125rem; }
  .sheet-is-open #prompt-form {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    gap: .25rem; padding-block: .375rem;
  }
  .sheet-is-open #prompt-form label { margin: 0; flex: none; }
  .sheet-is-open textarea { flex: 1; min-height: 0; height: 0; max-height: none; padding: .375rem; font-size: 16px; }
  .sheet-is-open .editor-bottom { flex: none; flex-wrap: nowrap; margin: 0; }
  .sheet-is-open .privacy-note, .sheet-is-open .last-result { display: none; }
}
@media (min-width: 768px) {
  #desktop-results { display: flex; min-block-size: 0; min-inline-size: 0; }
  #desktop-results > .results-panel { width: 100%; }
  .result-sheet, .result-sheet[open], .result-sheet.fallback-open { display: none; }
  .result-sheet:popover-open { display: none; }
  .result-toast, .result-toast.fallback-open, .sheet-close, .last-result { display: none; }
  .result-toast:popover-open { display: none; }
}
/* Entrada a la agencia: el editor solo aparece al terminar la bienvenida. */
body:not(.in-game) { height: auto; }
body:not(.in-game) > header, body:not(.in-game) > main.shell, body:not(.in-game) > .skip { display: none; }
.story-screen { width: min(480px, calc(100% - 2rem)); min-height: 100vh; min-height: 100dvh; margin-inline: auto; padding: max(1.5rem, env(safe-area-inset-top)) 0 max(1rem, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 1.25rem; }
.story-screen h1 { font-size: clamp(2.75rem, 12vw, 4rem); line-height: 1; color: var(--success); }
.agency-label { font-size: .75rem; letter-spacing: .15em; color: var(--title); }
.cover-content { margin-block: auto; padding-block: 2rem; }
.cover-content > p:last-child { max-width: 28ch; margin-top: 1.5rem; font-size: 1.125rem; }
.story-action { width: 100%; max-inline-size: none; min-height: 52px; flex: none; }
.story-screen .story-footer { margin-top: auto; padding-top: 1rem; }
.story-screen h2 { font-size: 1.4rem; color: var(--success); }
.intro { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.intro h1 { flex: 1; min-width: 0; }
.intro .eyebrow, .intro > .muted { flex-basis: 100%; }
.portfolio-link { flex: none; font-size: .75rem; color: var(--title); }
.portfolio-screen { padding-bottom: 2rem; }
.portfolio-work { border-block-start: 1px solid var(--border); padding-bottom: 1rem; }
.portfolio-work h3 { margin-top: 1rem; color: var(--title); }
.portfolio-work pre { font-size: .875rem; }
.guide-image { display: block; width: min(200px, 100%); height: auto; align-self: center; border: 1px solid var(--success); border-radius: 6px; }
.chat-message { border: 1px solid var(--border); border-left: 3px solid var(--title); border-radius: 4px; padding: .75rem; background: #10161e; }
.speaker { margin: 0 0 .375rem; color: var(--title); font-size: .75rem; }
.chat-message > p:last-child { margin-bottom: 0; }
.guide-message { border-left-color: var(--success); }
.guide-message .speaker { color: var(--success); }
.client-message { margin-block: .625rem; padding: .5rem .625rem; }
@media (min-width: 768px) { .intro { row-gap: 0; } }
.hint p + p { border-top: 1px solid #a58b37; padding-top: .625rem; }
.completion > .speaker { margin-top: .75rem; }
.completion button { margin-top: .75rem; width: 100%; }
#guide-feedback { margin-block: .75rem; }
.welcome-actions { display: flex; justify-content: space-between; gap: .75rem; }
.welcome-actions .primary { flex: 1; }
@media (min-width: 768px) { .guide-image { width: min(240px, 100%); } }
.story-screen p { overflow-wrap: anywhere; }
.inbox-screen { display: none; }
.in-game[data-mission-screen="mail"] .inbox-screen { display: block; }
.in-game[data-mission-screen="mail"] .workspace { display: none; }
.mail-item { display: flex; flex-direction: column; gap: .5rem; width: 100%; text-align: left; border-color: var(--title); }
.mail-item strong { color: var(--title); }
.mail-item .muted { font-size: .875rem; }
.mail-note { margin-top: 1rem; padding: .75rem; border: 1px solid var(--border); }
@media (max-width: 767px) {
  [data-mission-screen="chat"] .editor-panel, [data-mission-screen="chat"] #desktop-results { display: none; }
  [data-mission-screen="terminal"] .mission-panel { display: none; }
}
.editor-panel { background: #010409; }
.terminal-context { color: var(--muted); font-size: .75rem; margin: .375rem 0; }
.terminal-input { display: flex; gap: .25rem; align-items: flex-start; margin-top: .625rem; }
.prompt-prefix { color: var(--success); flex: none; padding-top: .625rem; }
.terminal-input textarea { min-width: 0; background: #010409; caret-color: var(--success); height: 9rem; min-height: 9rem; max-height: 9rem; }
.terminal-cursor { display: inline-block; width: .4rem; height: 1rem; background: var(--success); vertical-align: middle; }
.terminal-input:focus-within .terminal-cursor { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .terminal-cursor { animation: cursor-blink 1s steps(2, start) infinite; }
  @keyframes cursor-blink { to { visibility: hidden; } }
}
</style>
</head>
<body>
<section id="cover-screen" class="story-screen" aria-labelledby="cover-title">
  <div class="cover-content"><p class="agency-label" data-copy="agencyLabel"></p><h1 id="cover-title" tabindex="-1">PROMPT<br>QUEST</h1><p data-copy="coverPitch"></p></div>
  <div class="story-footer"><button id="start-day" class="primary story-action" type="button" data-copy="startDay"></button></div>
</section>
<section id="welcome-screen" class="story-screen" aria-labelledby="welcome-title" hidden>
  <div><p id="welcome-progress"></p><progress id="welcome-bar" max="3" value="1" aria-label="Progreso de bienvenida"></progress></div>
  <h2 id="welcome-title" tabindex="-1" data-copy="welcomeTitle"></h2>
  <img id="guide-image" class="guide-image" src="assets/epson_ia_mano_abajo.png" width="480" height="268" alt="Epson_IA, el mapache que te da la bienvenida" decoding="async">
  <div class="chat-message guide-message"><p class="speaker">Epson_IA</p><p id="welcome-message" aria-live="polite" aria-atomic="true"></p></div>
  <div class="story-footer welcome-actions"><button type="button" id="welcome-back" data-copy="back"></button><button type="button" id="welcome-next" class="primary"></button></div>
</section>
<section id="portfolio-screen" class="story-screen portfolio-screen" aria-labelledby="portfolio-title" hidden>
  <p class="agency-label" data-copy="agencyLabel"></p>
  <h2 id="portfolio-title" tabindex="-1"></h2>
  <div id="graduation-message" class="chat-message guide-message" hidden><p class="speaker">Epson_IA</p><p data-copy="graduationMessage"></p></div>
  <p id="portfolio-note" class="small muted" data-copy="portfolioNote"></p>
  <p id="portfolio-empty" data-copy="portfolioEmpty"></p>
  <div id="portfolio-items"></div>
  <div class="story-footer"><button type="button" id="return-game" class="primary story-action" data-copy="returnGame"></button></div>
</section>
<a class="skip" href="#prompt" data-copy="skip"></a>
<header>
  <div class="shell header-row">
    <div><p class="brand">&gt;_ <span>Prompt Quest</span></p><p class="subtitle" data-copy="tagline"></p></div>
    <div class="progress-box">
      <div class="progress-label"><span data-copy="level"></span><span id="progress-text"></span></div>
      <progress id="progress" value="0" max="3" aria-label="Reputación de la agencia: misiones completadas"></progress>
    </div>
  </div>
</header>
<main class="shell">
  <div class="intro">
    <p class="eyebrow" data-copy="missionNumber"></p>
    <h1 data-copy="missionTitle"></h1><button id="open-portfolio" type="button" class="portfolio-link" data-copy="portfolioTitle"></button>
    <p class="muted" data-copy="intro"></p>
  </div>
  <section id="inbox-screen" class="panel inbox-screen" aria-labelledby="inbox-title">
    <div class="panel-bar"><h2 id="inbox-title" data-copy="inbox"></h2><span class="tag" data-copy="unread"></span></div>
    <div class="panel-body mail-list">
      <button type="button" id="new-mail" class="mail-item"><strong id="mail-sender"></strong><span id="mail-subject"></span><span class="muted" id="mail-preview"></span></button>
      <article class="mail-note"><p class="speaker">Epson_IA</p><p data-copy="mailGuide"></p></article>
    </div>
    <div class="panel-body"><button type="button" class="primary" id="open-mail" data-copy="openMail"></button></div>
  </section>
  <div class="workspace">
    <div class="left">
      <section class="panel mission-panel" aria-labelledby="brief-title">

const language = 'es';

let criteria = CONTENT[language].criteria;
const state = { welcomeIndex:0, missionIndex:0, portfolio:new Map(), returnToSheet:false, hints:0, completed:new Set(), revision:0, busy:false, cache:new Map(), requests:[] };
const $ = id => document.getElementById(id);
const format = (template, values) => template.replace(/\{(\w+)\}/g, (_, key) => values[key]);
const normalize = text => text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();

function evaluatePrompt(prompt) {
  const normalized = normalize(prompt);
  const results = criteria.map(criterion => ({ ...criterion, passed:criterion.patterns.some(pattern => pattern.test(normalized)) }));
  return { results, passed:mission.required.every(id => results.find(result => result.id === id).passed) };
}

async function evaluateWithFallback(prompt) {
  const fallback = () => ({ ...evaluatePrompt(prompt), mode:ui.fallbackMode, feedback:'', ai:false });
  if (!['http:', 'https:'].includes(location.protocol)) {
    return { ...fallback(), mode:ui.simulationTag };
  }
  const key = JSON.stringify([mission.id, prompt]);
  if (state.cache.has(key)) return { ...state.cache.get(key), mode:ui.cachedMode };
  const now = Date.now();
  state.requests = state.requests.filter(time => now - time < 60000);
  if (state.requests.length >= 5) return fallback();
  state.requests.push(now);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 9000);
  try {
    const response = await fetch('/api/evaluar', {
      method:'POST', headers:{ 'Content-Type':'application/json' }, signal:controller.signal,
      body:JSON.stringify({ prompt, mision:{ id:mission.id, encargo:mission.brief, obligatorios:mission.required } })
    });
    if (!response.ok) throw new Error('unavailable');
    const data = await response.json();
    if (typeof data?.retroalimentacion !== 'string' || !data.retroalimentacion.trim()
      || data.retroalimentacion.length > 1200
      || !criteria.every(criterion => typeof data.criterios?.[criterion.id] === 'boolean'
        && typeof data.comentarios?.[criterion.id] === 'string'
        && data.comentarios[criterion.id].trim().length > 0
        && data.comentarios[criterion.id].length <= 600)) throw new Error('invalid');
    const results = criteria.map(criterion => ({ ...criterion, passed:data.criterios[criterion.id], feedback:data.comentarios[criterion.id] }));
    const evaluation = { results, passed:mission.required.every(id => data.criterios[id]), feedback:data.retroalimentacion, mode:ui.aiMode, ai:true };
    if (state.cache.size >= 50) state.cache.delete(state.cache.keys().next().value);
    state.cache.set(key, evaluation);
    return evaluation;
  } catch {
    return fallback();
  } finally {
    clearTimeout(timer);
  }
}

function renderCriteria(results = null) {
  $('criteria').replaceChildren(...criteria.map((criterion, index) => {
    const result = results && results[index];
    const item = document.createElement('li');
    item.className = 'criterion ' + (result ? (result.passed ? 'pass' : 'fail') : 'pending');
    const symbol = document.createElement('span');
    symbol.className = 'symbol';
    symbol.textContent = result ? (result.passed ? '✓' : '✗') : '·';
    symbol.setAttribute('aria-label', result ? (result.passed ? ui.fulfilled : ui.undetected) : ui.pendingLabel);
    const body = document.createElement('div');
    const label = document.createElement('strong');
    label.textContent = criterion.label;
    const requirement = document.createElement('span');
    requirement.className = 'requirement';
    requirement.textContent = mission.required.includes(criterion.id) ? ui.required : ui.optional;
    const feedback = document.createElement('p');
    feedback.textContent = result ? (result.feedback || (result.passed ? criterion.yes : criterion.no)) : ui.pending;
    body.append(label, requirement, feedback);
    item.append(symbol, body);
    return item;
  }));
}

function updateEditor() {
  const count = evaluatePrompt($('prompt').value).results.filter(result => result.passed).length;
  $('criteria-count').textContent = format(ui.liveCounter, { count });
  $('character-count').textContent = format(ui.characters, { count:$('prompt').value.length });
}

function recordWork(prompt, evaluation) {
  if (!evaluation.passed) return;
  state.portfolio.set(mission.id, {
    title:mission.title, client:mission.client, prompt, response:mission.reference,
    count:evaluation.results.filter(result => result.passed).length
  });
}

function selectMission(index) {
  if (state.busy || index !== state.missionIndex + 1 || !missions[index]
    || !state.completed.has(mission.id)) return false;
  state.missionIndex = index;
  mission = missions[index];
  criteria = CONTENT[language].criteria.map(criterion => ({ ...criterion, ...mission.rules?.[criterion.id] }));
  state.hints = 0;
  state.revision += 1;
  return true;
}

document.querySelectorAll('[data-copy]').forEach(element => { element.textContent = ui[element.dataset.copy]; });
$('prompt').placeholder = ui.placeholder;
$('editor-help').textContent = ui.editorHelp + ' ' + ui.privacy;

function renderProgress() {
  $('progress').value = state.completed.size;
  $('progress-text').textContent = format(ui.progress, { count:state.completed.size });
}

function renderMail() {
  document.body.dataset.missionScreen = 'mail';
  $('mail-sender').textContent = mission.client;
  $('mail-subject').textContent = mission.mailSubject || mission.title;
  $('mail-preview').textContent = mission.brief.slice(0, 60) + '…';
}
function renderMission() {
  renderMail();
  const values = { ...mission, number:state.missionIndex + 1 };
  for (const name of ['level','missionNumber','missionTitle']) {
    document.querySelector(`[data-copy="${name}"]`).textContent = format(ui[name], values);
  }
  document.querySelector('[data-copy="clientTag"]').textContent = mission.clientTag;
  $('client-name').textContent = mission.client;
  $('brief').textContent = mission.brief;
  $('terminal-to').textContent = format(ui.terminalTo, mission);
  $('terminal-brief').textContent = format(ui.terminalBrief, mission);
  $('prompt').value = '';
  $('prompt').removeAttribute('aria-invalid');
  $('input-error').hidden = true;
  $('hint').replaceChildren();
  $('hint').hidden = true;
  $('hint-button').textContent = ui.hint;
  $('hint-button').disabled = false;
  $('hint-button').setAttribute('aria-expanded','false');
  $('result-summary').textContent = ui.waiting;
  $('evaluation-mode').textContent = ['http:', 'https:'].includes(location.protocol) ? ui.pendingMode : ui.simulationTag;
  $('evaluation-notice').textContent = ui.limitations;
  $('response').hidden = true;
  $('completion').hidden = true;
  $('guide-feedback').hidden = true;
  $('next-mission').hidden = true;
  $('view-graduation').hidden = true;
  $('sheet-score').textContent = '0 / 6 criterios';
  $('required-chips').replaceChildren(...mission.required.map(id => {
    const chip = document.createElement('li');
    chip.textContent = criteria.find(criterion => criterion.id === id).label;
    return chip;
  }));
  renderProgress();
  renderCriteria();
  updateEditor();
}
renderMission();

function createGuideAnimation(image, {
  ImageType = Image,
  motion = window.matchMedia('(prefers-reduced-motion: reduce)'),
  page = document,
  schedule = setTimeout,
  cancel = clearTimeout,
  random = Math.random
} = {}) {
  const loaded = new Set();
  const timers = new Set();
  const preload = [];
  let active = false;
  let failed = false;
  let restFailed = false;
  function clearTimers() {
    for (const id of timers) cancel(id);
    timers.clear();
  }
  function later(callback, delay) {
    const id = schedule(() => { timers.delete(id); callback(); }, delay);
    timers.add(id);
  }
  function show(frame) {
    if (!loaded.has(frame)) return;
    image.hidden = false;
    if (image.getAttribute('src') !== GUIDE_FRAMES[frame]) image.src = GUIDE_FRAMES[frame];
  }
  function rest() {
    if (restFailed) {
      image.hidden = false;
      if (image.getAttribute('src') !== GUIDE_REST_FALLBACK) image.src = GUIDE_REST_FALLBACK;
    } else if (loaded.has('rest')) show('rest');
    else image.hidden = true;
  }
  function canMove() { return active && !failed && !motion.matches && !page.hidden; }
  function queueBlink() {
    if (!canMove()) return;
    later(() => {
      if (!canMove()) return;
      show('blink');
      later(() => { rest(); queueBlink(); }, 150);
    }, 3000 + random() * 2000);
  }
  function message() {
    active = true;
    clearTimers();
    rest();
    if (!canMove() || loaded.size !== 3) return;
    show('wave');
    later(() => { rest(); queueBlink(); }, 800);
  }
  function stop() { active = false; clearTimers(); rest(); }
  function degrade(frame) {
    failed = true;
    if (frame === 'rest') restFailed = true;
    clearTimers();
    rest();
  }
  for (const [frame, source] of Object.entries(GUIDE_FRAMES)) {
    const asset = new ImageType();
    preload.push(asset);
    asset.onload = () => {
      loaded.add(frame);
      if (frame === 'rest') rest();
      if (loaded.size === 3 && active) message();
    };
    asset.onerror = () => degrade(frame);
    asset.src = source;
  }
  image.addEventListener('error', () => {
    if (image.getAttribute('src') === GUIDE_FRAMES.rest) {
      loaded.delete('rest');
      degrade('rest');
    } else if (image.getAttribute('src') === GUIDE_REST_FALLBACK) {
      image.hidden = true;
    } else degrade();
  });
  const refresh = () => {
    clearTimers();
    rest();
    if (canMove() && loaded.size === 3) queueBlink();
  };
  motion.addEventListener('change', refresh);
  page.addEventListener('visibilitychange', refresh);
  return { message, stop };
}

function renderWelcome() {
  $('welcome-progress').textContent = format(ui.welcomeProgress, { current:state.welcomeIndex + 1 });
  $('welcome-bar').value = state.welcomeIndex + 1;
  $('welcome-message').textContent = CONTENT[language].welcome[state.welcomeIndex];
  $('welcome-back').disabled = state.welcomeIndex === 0;
  $('welcome-next').textContent = state.welcomeIndex === 2 ? ui.startTrial : ui.next;
  guideAnimation.message();
}
for (const id of ['new-mail','open-mail']) $(id).addEventListener('click', () => {
  document.body.dataset.missionScreen = 'chat';
  $('client-name').focus();
});
$('back-chat').addEventListener('click', () => { document.body.dataset.missionScreen='chat'; $('client-name').focus(); });
$('back-mail').addEventListener('click', () => { document.body.dataset.missionScreen='mail'; $('new-mail').focus(); });
$('start-prompt').addEventListener('click', () => { document.body.dataset.missionScreen='terminal'; $('prompt').focus(); });
$('start-day').addEventListener('click', () => {
  $('cover-screen').hidden = true;
  $('welcome-screen').hidden = false;
  renderWelcome();
  $('welcome-title').focus();
});
$('welcome-back').addEventListener('click', () => {
  if (state.welcomeIndex > 0) state.welcomeIndex -= 1;
  renderWelcome();
});
$('welcome-next').addEventListener('click', () => {
  if (state.welcomeIndex < 2) { state.welcomeIndex += 1; renderWelcome(); return; }
  guideAnimation.stop();
  $('welcome-screen').hidden = true;
  document.body.classList.add('in-game');
  $('prompt').focus();
});

$('next-mission').addEventListener('click', () => {
  if (!selectMission(state.missionIndex + 1)) return;
  closeResults();
  resetResultPresentation();
  $('results-content').scrollTop = 0;
  renderMission();
  $('prompt').focus();
});

function renderPortfolio(graduation) {
  $('portfolio-title').textContent = graduation ? ui.graduationTitle : ui.portfolioTitle;
  $('graduation-message').hidden = !graduation;
  $('portfolio-empty').hidden = state.portfolio.size > 0;
  const items = [];
  for (const work of state.portfolio.values()) {
    const item = document.createElement('details');
    item.className = 'portfolio-work';
    const summary = document.createElement('summary');
    summary.textContent = work.title + ' · ' + work.count + ' / 6';
    const client = document.createElement('p');
    client.className = 'small muted';
    client.textContent = work.client;
    item.append(summary, client);
    for (const [label, text] of [[ui.yourPrompt, work.prompt], [ui.fixedResponse, work.response]]) {
      const heading = document.createElement('h3');
      heading.textContent = label;
      const content = document.createElement('pre');
      content.textContent = text;
      item.append(heading, content);
    }
    items.push(item);
  }
  $('portfolio-items').replaceChildren(...items);
}
function showPortfolio(graduation = false) {
  if (graduation && state.completed.size !== missions.length) return;
  state.returnToSheet = !desktopLayout.matches && isOverlayOpen($('result-sheet'));
  closeResults();
  hideOverlay($('result-toast'));
  renderPortfolio(graduation);
  document.body.classList.remove('in-game');
  $('portfolio-screen').hidden = false;
  $('portfolio-title').focus();
}
$('open-portfolio').addEventListener('click', () => showPortfolio());
$('view-graduation').addEventListener('click', () => showPortfolio(true));
$('return-game').addEventListener('click', () => {
  $('portfolio-screen').hidden = true;
  document.body.classList.add('in-game');
  if (state.returnToSheet) openResults(document.querySelector('.primary[type="submit"]'));
  else $('open-portfolio').focus();
});

$('hint-button').addEventListener('click', () => {
  if (state.hints >= mission.hints.length) return;
  const paragraph = document.createElement('p');
  paragraph.textContent = 'Epson_IA · ' + format(ui.hintNumber, { current:state.hints + 1 }) + ': ' + mission.hints[state.hints];
  const inChat = document.body.dataset.missionScreen === 'chat';
  (inChat ? $('chat-hints') : $('hint')).append(paragraph);
  state.hints += 1;
  $('hint').hidden = false;
  $('results-content').scrollTop = 0;
  $('hint-button').setAttribute('aria-expanded','true');
  $('hint-button').textContent = state.hints === mission.hints.length ? ui.hintsDone : ui.nextHint;
  $('hint-button').disabled = state.hints === mission.hints.length;
  if (!inChat) openResults($('hint-button'));
});

$('prompt').addEventListener('input', () => {
  resetResultPresentation();
  state.revision += 1;
  updateEditor();
  $('input-error').hidden = true;
  $('prompt').removeAttribute('aria-invalid');
  if (!resultPresentation.keepVisible) {
    $('response').hidden = true;
    $('completion').hidden = true;
    $('result-summary').textContent = ui.edited;
    renderCriteria();
  }
});

$('prompt-form').addEventListener('submit', async event => {
  event.preventDefault();
  if (state.busy) return;
  const prompt = $('prompt').value;
  if (!prompt.trim() || prompt.length > 1500) {
    $('input-error').textContent = prompt.length > 1500 ? ui.tooLong : ui.empty;
    $('input-error').hidden = false;
    $('prompt').setAttribute('aria-invalid','true');
    $('prompt').focus();
    return;
  }
  state.busy = true;
  $('evaluating-line').hidden = false;
  const revision = state.revision;

  executeButton.textContent = ui.evaluating;
  $('result-summary').textContent = ui.evaluatingSummary;
  let evaluation;
  try {
    evaluation = await evaluateWithFallback(prompt);
  } finally {
    state.busy = false;
    $('evaluating-line').hidden = true;
    executeButton.disabled = false;
    executeButton.textContent = ui.execute;
  }
  // No aplicar una respuesta que llegó después de que el jugador editara el texto.
  if (state.revision !== revision) return;
  $('evaluation-mode').textContent = evaluation.mode;
  $('evaluation-notice').textContent = evaluation.ai ? ui.aiLimitations : ui.limitations;
  renderCriteria(evaluation.results);
  const firstMissing = evaluation.results.find(result => mission.required.includes(result.id) && !result.passed);
  $('guide-feedback').hidden = !firstMissing;
  $('guide-feedback-text').textContent = firstMissing ? ui.mentorTips[firstMissing.id] : '';
  const count = evaluation.results.filter(result => result.passed).length;
  const missing = evaluation.results.filter(result => mission.required.includes(result.id) && !result.passed).map(result => result.label).join(', ');
  $('result-summary').textContent = format(evaluation.passed ? ui.success : ui.retry, { count, missing, requiredCount:mission.required.length }) + (evaluation.feedback ? ' ' + evaluation.feedback : '');
  $('response').hidden = false;
  $('response-title').textContent = evaluation.passed ? ui.referenceTitle : ui.weakTitle;
  $('response-note').textContent = evaluation.passed ? ui.referenceNote : ui.weakNote;
  $('response-text').textContent = evaluation.passed ? mission.reference : mission.weakResponse;
  $('completion').hidden = !evaluation.passed;
  if (evaluation.passed) state.completed.add(mission.id);
  recordWork(prompt, evaluation);
  $('view-graduation').hidden = !evaluation.passed || state.completed.size !== missions.length;
  $('completion-text').textContent = state.completed.size === missions.length ? ui.allCompleted : mission.completion;
  $('client-reaction-name').textContent = mission.client;
  $('client-reaction').textContent = mission.thanks;
  $('next-client-preview').textContent = missions[state.missionIndex + 1] ? format(ui.nextClient, { client:missions[state.missionIndex + 1].client }) : '';
  $('next-mission').hidden = !evaluation.passed || state.missionIndex === missions.length - 1;
  renderProgress();
  presentResult(count);
});

// Presentación responsiva: el evaluador anterior conserva su contrato y sus reglas.
const desktopLayout = window.matchMedia('(min-width: 768px)');
const resultPresentation = { available:false, opener:null, keepVisible:false };
const supportsPopover = 'popover' in HTMLElement.prototype;

function isOverlayOpen(element) {
  return supportsPopover ? element.matches(':popover-open') : element.classList.contains('fallback-open');
}

function showOverlay(element) {
  if (isOverlayOpen(element)) return;
  if (supportsPopover) element.showPopover();
  else {
    element.classList.add('fallback-open');
    if (element instanceof HTMLDialogElement) element.show();
  }
}

function hideOverlay(element) {
  if (!isOverlayOpen(element)) return;
  if (supportsPopover) element.hidePopover();
  else {
    element.classList.remove('fallback-open');
    if (element instanceof HTMLDialogElement) element.close();
  }
}

function positionResultOverlays() {
  if (desktopLayout.matches) return;
  const button = document.querySelector('#prompt-form .primary').getBoundingClientRect();
  const toastHeight = $('result-toast').getBoundingClientRect().height;
  const toastTop = Math.max(8, Math.min(button.bottom + 12, window.innerHeight - toastHeight - 12));
  $('result-toast').style.setProperty('--toast-top', toastTop + 'px');
}

function closeResults() {
  const sheet = $('result-sheet');
  const wasFocused = sheet.contains(document.activeElement);
  hideOverlay(sheet);
  document.body.classList.remove('sheet-is-open');
  $('open-result').setAttribute('aria-expanded', 'false');
  $('last-result').setAttribute('aria-expanded', 'false');
  // El aviso se oculta al abrir: usar su alternativa permanente al devolver el foco.
  if (wasFocused) {
    const target = resultPresentation.opener === $('open-result') ? $('last-result') : resultPresentation.opener;
    if (target?.isConnected && !target.hidden && !target.disabled) target.focus({ preventScroll:true });
    else document.querySelector('#prompt-form .primary').focus({ preventScroll:true });
  }
}

function openResults(opener) {
  if (desktopLayout.matches) {
    $('results-content').focus({ preventScroll:true });
    if (opener === $('hint-button')) scrollToHint();
    return;
  }
  resultPresentation.opener = opener;
  hideOverlay($('result-toast'));
  document.body.classList.add('sheet-is-open');
  showOverlay($('result-sheet'));
  $('close-results').focus({ preventScroll:true });
  $('open-result').setAttribute('aria-expanded', 'true');
  $('last-result').setAttribute('aria-expanded', 'true');
  if (opener === $('hint-button')) scrollToHint();
}

function scrollToHint() {
  const content = $('results-content');
  content.scrollTop += $('hint').getBoundingClientRect().top - content.getBoundingClientRect().top;
}

function resetResultPresentation() {
  resultPresentation.keepVisible = !desktopLayout.matches && isOverlayOpen($('result-sheet'));
  if (!resultPresentation.keepVisible) closeResults();
  $('sheet-edit-note').hidden = !resultPresentation.keepVisible;
  hideOverlay($('result-toast'));
  resultPresentation.available = false;
  $('last-result').hidden = true;
  $('result-announcement').textContent = '';
}

function presentResult(count) {
  resultPresentation.available = true;
  resultPresentation.keepVisible = false;
  $('sheet-edit-note').hidden = true;
  $('sheet-score').textContent = `${count} / 6 criterios`;
  if (count < 6) $('sheet-score').classList.add('is-incomplete');
  else $('sheet-score').classList.remove('is-incomplete');
  $('toast-count').textContent = format(ui.resultCount, { count });
  $('last-result').hidden = false;
  $('results-content').scrollTop = 0;
  if ($('portfolio-screen') && !$('portfolio-screen').hidden) return;
  if (!desktopLayout.matches) {
    if (!isOverlayOpen($('result-sheet'))) showOverlay($('result-toast'));
    positionResultOverlays();
    $('result-announcement').textContent = format(ui.resultReady, { count });
  }
}

function syncResultLayout() {
  const hadResultFocus = $('results-panel').contains(document.activeElement);
  closeResults();
  hideOverlay($('result-toast'));
  const destination = desktopLayout.matches ? $('desktop-results') : $('result-sheet');
  destination.append($('results-panel'));
  // Orden de lectura móvil: resumen grande, criterios y retroalimentación completa.
  if (desktopLayout.matches) $('hint').after($('criteria'));
  else $('results-content').prepend($('criteria'));
  const guide = $('guide-feedback');
  if (guide) {
    if (desktopLayout.matches) $('result-summary').before(guide);
    else $('results-content').prepend(guide);
  }
  $('sheet-edit-note').hidden = true;
  if (hadResultFocus) {
    // Esperar al traslado del nodo para no perder el foco al cerrarse el Popover.
    requestAnimationFrame(() => {
      if (desktopLayout.matches) $('results-content').focus({ preventScroll:true });
      else document.querySelector('#prompt-form .primary').focus({ preventScroll:true });
    });
  }
  if (desktopLayout.matches) $('result-announcement').textContent = '';
  $('last-result').hidden = !resultPresentation.available;
  positionResultOverlays();
}

$('open-result').addEventListener('click', () => openResults($('open-result')));
$('last-result').addEventListener('click', () => openResults($('last-result')));
$('close-results').addEventListener('click', closeResults);
$('close-toast').addEventListener('click', () => {
  const wasFocused = $('result-toast').contains(document.activeElement);
  hideOverlay($('result-toast'));
  if (wasFocused) $('last-result').focus({ preventScroll:true });
});
$('result-sheet').addEventListener('keydown', event => {
  if (event.key === 'Escape') { event.preventDefault(); closeResults(); }
});
window.addEventListener('resize', positionResultOverlays);
window.addEventListener('scroll', positionResultOverlays, { passive:true });
new ResizeObserver(positionResultOverlays).observe($('prompt-form'));
desktopLayout.addEventListener('change', syncResultLayout);
syncResultLayout();
</script>
</body>
</html>
